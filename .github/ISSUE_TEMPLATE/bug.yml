name: Bug report
description: Something in the app or engine is broken (crash, UI problem, wrong behavior).
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BeanyLab version and OS
      placeholder: "0.1.0, Ubuntu 24.04"
