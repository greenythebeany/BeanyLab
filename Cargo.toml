[workspace]
members = ["crates/beany-core", "crates/beany-cli", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/greenythebeany/BeanyLab"
authors = ["The BeanyLab contributors"]

[workspace.dependencies]
beany-core = { path = "crates/beany-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package."*"]
opt-level = 2
